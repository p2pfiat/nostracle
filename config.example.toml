# Copy to config.toml and adjust.
key_file = "data/oracle.key"
db_file  = "data/events.json"   # BACK UP together with the key (see README)

relays = [
  "wss://relay.primal.net",
  "wss://relay.damus.io",
  "wss://nos.lol",
  "wss://relay.snort.social",
  "wss://nostr.bitcoiner.social",
  "wss://relay.nostr.band",
]
min_relay_acks   = 3            # published = accepted by at least this many relays
rebroadcast_secs = 21600        # re-send recent events every 6h

pairs = ["USD", "EUR"]

num_digits    = 20              # max attestable price 1_048_575
min_sources   = 5               # quotes needed: 4 exchanges + Delphi + PriceStr = 6
min_agreeing  = 3               # of those, within max_deviation of the median
max_deviation = 0.01            # 1%
max_attest_delay_secs = 3600    # later than this: event is MISSED, contracts refund
archive_after_secs    = 604800  # move finished events to events.archive.jsonl after 7 days
tick_secs = 30

# Event schedules. A maturity shared by two series is one event.
[[series]]                      # short-term: hourly, 2 days ahead
interval_secs = 3600
horizon_secs  = 172800

[[series]]                      # contract maturities: daily 00:00 UTC, 90 days ahead
interval_secs = 86400
horizon_secs  = 7776000

# Extra price feeds read from nostr. They count as normal quotes in the median.
# [nostr_feeds]
# enabled = true
# delphi_max_age_secs   = 10800
# pricestr_max_age_secs = 120
# orderbook_enabled = true             # p2pFiat kind:38384 weighted-median price source
# orderbook_min_lps = 3                # require at least N distinct signed LPs
# orderbook_max_age_secs = 180
# orderbook_max_abs_funding_bps = 20.0 # ignore extreme basis quotes

# [profile]
[profile]
name  = "nostracle"
# lud16 = "you@your-lightning-address.com"   # receive zaps
# website = "https://github.com/p2pfiat/nostracle"

# Optional public kind-1 social feed posts (BTC/USD, USD/BTC, sats/USD) on nostr.
# Only posts once an attestation is public (never leaks paid attestations early).
# [social_feed]
# enabled = true
# min_interval_secs = 3600
# include_inverse = true
# hashtags = ["nostracle", "p2pfiat"]
# mentions = ["npub1..."]              # optional NIP-27 mentions (`nostr:npub...` + `p` tag)

# Paid attestations over zaps. Needs lud16 above, on a provider that supports zaps.
# Remove this section to publish all attestations for free.
# [pricing]
# attestation_sats  = 100       # zap on an announcement buys its attestation
# custom_event_sats = 1000      # zap on the profile creates a custom event
# custom_min_lead_secs    = 600
# custom_max_horizon_secs = 31536000
# public_attestation_delay_secs = 86400   # optional: free for everyone after a delay
