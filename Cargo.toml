[package]
name = "nostracle"
version = "0.1.0"
edition = "2021"
description = "DLC price oracle publishing DLC announcements and attestations on nostr (kinds 88/89)"
license = "MIT"
repository = "https://github.com/p2pfiat/nostracle"

[dependencies]
kormir = { version = "1.1.2", features = ["nostr"] }
nostr-sdk = { version = "0.44", features = ["nip59"] }
lightning-invoice = "0.34"
tokio = { version = "1", features = ["macros", "rt", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
hex = "0.4"
base64 = "0.22"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
nostr-relay-builder = "0.44"
